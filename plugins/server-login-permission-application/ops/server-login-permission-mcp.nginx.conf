# Install this as a dedicated UAT virtual host. Set server_name and TLS paths once.
server {
    listen 443 ssl http2;
    server_name mcp-uat.example.com;

    ssl_certificate /etc/nginx/tls/mcp-uat.crt;
    ssl_certificate_key /etc/nginx/tls/mcp-uat.key;

    location = /mcp {
        proxy_pass http://127.0.0.1:8001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
    }
}
